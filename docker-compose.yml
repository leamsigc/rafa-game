services:
  dog-game:
    build: .
    image: 3d-dog-companion-game:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # GEMINI_API_KEY is optional — game falls back to local_engine without it.
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
