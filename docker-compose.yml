services:
  dog-game:
    # Pull the pre-built image pushed to GHCR by the GitHub Actions workflow
    # (.github/workflows/docker.yml). To build locally instead, comment out
    # `image:` and uncomment `build: .` below.
    image: ghcr.io/leamsigc/rafa-game:latest
    # build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # GEMINI_API_KEY is optional — the game falls back to a local dialogue
      # engine without it. Set it via .env or your orchestrator's env vars.
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
